# Publica en GitHub Pages las apps web: Granos (en la raíz), Tablas (/tablas/), Ecos (/ecos/) y Enjambre (/enjambre/).
# Requisito (una sola vez): Settings › Pages › Source = "GitHub Actions".
name: Granos, Tablas, Ecos y Enjambre · publicar PWA

on:
  push:
    branches: [main]
    paths: ['granos/**', 'tablas/**', 'ecos/**', 'enjambre/**', '.github/workflows/granos-pages.yml']
  # En los pull requests solo se prueban los tests y la compilación (no se publica).
  pull_request:
    paths: ['granos/**', 'tablas/**', 'ecos/**', 'enjambre/**', '.github/workflows/granos-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            granos/package-lock.json
            tablas/package-lock.json
            ecos/package-lock.json
            enjambre/package-lock.json
      - name: Granos · tests y compilación
        working-directory: granos
        run: |
          npm ci
          npm test
          npm run build
      - name: Tablas · tests y compilación
        working-directory: tablas
        run: |
          npm ci
          npm run check
          npm test
          npm run build
      - name: Ecos · tests y compilación
        working-directory: ecos
        run: |
          npm ci
          npm run check
          npm test
          npm run build
      - name: Enjambre · tests y compilación
        working-directory: enjambre
        run: |
          npm ci
          npm run check
          npm test
          npm run build
      - name: Reunir el sitio (Granos en la raíz y cada app en su carpeta)
        run: |
          mkdir -p site/tablas site/ecos site/enjambre
          cp -r granos/dist/. site/
          cp -r tablas/dist/. site/tablas/
          cp -r ecos/dist/. site/ecos/
          cp -r enjambre/dist/. site/enjambre/
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: site

  # GitHub Pages solo acepta publicaciones desde main.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
