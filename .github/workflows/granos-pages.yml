# Publica la PWA de Granos en GitHub Pages.
# Requisito (una sola vez): Settings › Pages › Source = "GitHub Actions".
name: Granos · publicar PWA

on:
  push:
    branches: [main]
    paths: ['granos/**', '.github/workflows/granos-pages.yml']
  # En los pull requests solo se prueban los tests y la compilación (no se publica).
  pull_request:
    paths: ['granos/**', '.github/workflows/granos-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: granos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: granos/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: granos/dist

  # GitHub Pages solo acepta publicaciones desde main.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
